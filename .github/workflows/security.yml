name: Security
on:
  workflow_call:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      # Audit the entire repository, including findings outside this PR's diff.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
      CODEQL_ACTION_OVERLAY_ANALYSIS: 'false'
    permissions:
      contents: read
      security-events: write # Upload CodeQL results to code scanning.
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, c-cpp, python, actions]
        include:
          - language: csharp
            build-mode: manual
          - language: c-cpp
            build-mode: manual
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    concurrency:
      group: security-codeql-${{ matrix.language }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ${{ matrix.language == 'python' && '.github/codeql/python.yml' || '' }}
          queries: security-extended,security-and-quality
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: matrix.language == 'csharp'
        with:
          global-json-file: global.json
      - name: Trace every C# project with its actual references and entry point
        if: matrix.language == 'csharp'
        run: bash scripts/build-codeql-csharp.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.language == 'c-cpp'
        with:
          python-version: '3.15.2'
      - name: Resolve native dependencies for accurate macro and template analysis
        if: matrix.language == 'c-cpp'
        run: |
          bash scripts/setup-compiler.sh gcc
          echo "CC=gcc-16" >> "$GITHUB_ENV"
          echo "CXX=g++-16" >> "$GITHUB_ENV"
          CC=gcc-16 CXX=g++-16 bash cpp/setup.sh
      - name: Trace the real native build and execute its tests
        if: matrix.language == 'c-cpp'
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '1'
        run: bash cpp/run_tests.sh
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
      - name: Reject all CodeQL findings and incomplete reports
        run: python3 scripts/check_sarif.py codeql-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: error
          retention-days: 14
  audit:
    name: audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: security-audit-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Audit all NuGet dependencies, including transitive packages
        run: |
          dotnet restore csharp/Platform.Data.Doublets.sln --locked-mode -warnaserror -p:NuGetAuditMode=all
          dotnet list csharp/Platform.Data.Doublets.sln package --vulnerable --include-transitive --format json > nuget-audit.json
          python3 scripts/check_audit.py nuget-audit.json
      - name: Scan repository history for credentials
        run: bash scripts/check-secrets.sh
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Audit Python helper dependencies, including transitive packages
        run: |
          python3 -m pip install -r scripts/requirements-audit.txt
          python3 -m pip_audit -r scripts/requirements-ci.txt -r scripts/requirements-quality.txt -r scripts/requirements-audit.txt --format json --output python-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-audits
          path: '*-audit.json'
          if-no-files-found: error
          retention-days: 14
