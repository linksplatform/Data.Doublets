name: Security
on:
  workflow_call:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Audit the entire repository, including findings outside this PR's diff.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
    permissions:
      contents: read
      security-events: write # Upload CodeQL results to code scanning.
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, c-cpp, actions]
        include:
          - language: csharp
            build-mode: none
          - language: c-cpp
            build-mode: manual
          - language: actions
            build-mode: none
    concurrency:
      group: security-codeql-${{ matrix.language }}-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: matrix.language == 'c-cpp'
        with:
          python-version: '3.12'
      - name: Resolve native dependencies for accurate macro and template analysis
        if: matrix.language == 'c-cpp'
        run: bash cpp/setup.sh
      - name: Trace the real native build and execute its tests
        if: matrix.language == 'c-cpp'
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '1'
        run: bash cpp/run_tests.sh
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
      - name: Reject all CodeQL findings and incomplete reports
        run: python3 scripts/check_sarif.py codeql-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: error
          retention-days: 14
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: security-audit-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Audit all NuGet dependencies, including transitive packages
        run: |
          dotnet restore csharp/Platform.Data.Doublets.sln --locked-mode -warnaserror -p:NuGetAuditMode=all
          dotnet list csharp/Platform.Data.Doublets.sln package --vulnerable --include-transitive --format json > nuget-audit.json
          python3 scripts/check_audit.py nuget-audit.json
      - name: Scan repository history for credentials
        run: bash scripts/check-secrets.sh
