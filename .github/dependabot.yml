version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /
      - /csharp/*
      - /examples/*
      - /experiments/*
      - /experiments/*/*
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /
      - /scripts
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directories:
      - /experiments/issue-359/RustParity
      - /experiments/issue-519
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: gitsubmodule
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
